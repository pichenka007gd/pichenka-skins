plugins {
    id 'java'
}

group = 'pichenka007gd'
version = '1.0.0'

repositories {
    mavenCentral()
}

configurations {
    specialsource
}

dependencies {
    specialsource 'net.md-5:SpecialSource:1.8.4:shaded'
}

def mappingsDir = layout.projectDirectory.dir('mappings')
def workDir = layout.buildDirectory.dir('mc').get()
def clientJar = workDir.file('client-1.2.5.jar')
def mappedJar = workDir.file('client-mapped.jar')
def combinedSrg = layout.buildDirectory.file('mappings/combined.srg')
def thinJar = layout.buildDirectory.file('thin/pichenka-skins-thin.jar')
def obfJar = layout.buildDirectory.file('obf/pichenka-skins-obf.jar')

def mcClientUrl = 'https://launcher.mojang.com/v1/objects/4a2fac7504182a97dcbcd7560c6392d7c8139928/client.jar'
def mcClientSha1 = '4a2fac7504182a97dcbcd7560c6392d7c8139928'

tasks.register('downloadClient') {
    description = 'Downloads the official Minecraft 1.2.5 client jar from Mojang and verifies its SHA-1.'
    def out = clientJar
    def url = mcClientUrl
    def sha1 = mcClientSha1
    outputs.file(out)
    doLast {
        out.asFile.parentFile.mkdirs()
        if (!out.asFile.exists() || sha1 != sha1Of(out.asFile)) {
            println 'Downloading Minecraft 1.2.5 client...'
            new URL(url).withInputStream { input ->
                out.asFile.withOutputStream { output -> output << input }
            }
        }
        def actual = sha1Of(out.asFile)
        if (actual != sha1) {
            throw new GradleException("client.jar SHA-1 mismatch: expected ${sha1}, got ${actual}")
        }
    }
}

tasks.register('buildCombinedSrg') {
    description = 'Builds obf->MCP SRG mapping and its deduplicated reverse for SpecialSource.'
    def out = combinedSrg
    def outReverse = layout.buildDirectory.file('mappings/combined-reverse.srg')
    inputs.files(mappingsDir.file('client.srg'), mappingsDir.file('fields.csv'), mappingsDir.file('methods.csv'))
    outputs.files(out, outReverse)
    doLast {
        def fieldMap = [:]
        def methodMap = [:]
        mappingsDir.file('fields.csv').asFile.eachLine('UTF-8') { line ->
            def parts = line.split(',', 3)
            if (parts.length >= 2 && parts[0].startsWith('field_')) fieldMap[parts[0]] = parts[1]
        }
        mappingsDir.file('methods.csv').asFile.eachLine('UTF-8') { line ->
            def parts = line.split(',', 3)
            if (parts.length >= 2 && parts[0].startsWith('func_')) methodMap[parts[0]] = parts[1]
        }
        def text = mappingsDir.file('client.srg').asFile.getText('UTF-8')
        def result = text.readLines().collect { line ->
            if (line.startsWith('FD: ')) {
                def parts = line.split(' ')
                if (parts.length != 3) return line
                def name = parts[2].substring(parts[2].lastIndexOf('/') + 1)
                def mapped = fieldMap[name]
                return mapped ? "FD: ${parts[1]} ${parts[2].substring(0, parts[2].lastIndexOf('/'))}/${mapped}" : line
            }
            if (line.startsWith('MD: ')) {
                def parts = line.split(' ')
                if (parts.length != 5) return line
                def name = parts[3].substring(parts[3].lastIndexOf('/') + 1)
                def mapped = methodMap[name]
                return mapped ? "MD: ${parts[1]} ${parts[2]} ${parts[3].substring(0, parts[3].lastIndexOf('/'))}/${mapped} ${parts[4]}" : line
            }
            return line
        }
        out.get().asFile.parentFile.mkdirs()
        out.get().asFile.setText(result.join('\n') + '\n', 'UTF-8')

        def seen = new HashSet<String>()
        def reverse = []
        result.each { line ->
            if (line.startsWith('CL: ')) {
                def parts = line.split(' ')
                if (parts.length == 3) reverse.add("CL: ${parts[2]} ${parts[1]}")
            } else if (line.startsWith('PK: ')) {
                def parts = line.split(' ')
                if (parts.length == 3) reverse.add("PK: ${parts[2]} ${parts[1]}")
            } else if (line.startsWith('FD: ')) {
                def parts = line.split(' ')
                if (parts.length == 3) {
                    def key = "${parts[2]}|field"
                    if (seen.add(key)) reverse.add("FD: ${parts[2]} ${parts[1]}")
                }
            } else if (line.startsWith('MD: ')) {
                def parts = line.split(' ')
                if (parts.length == 5) {
                    def key = "${parts[3]} ${parts[4]}|method"
                    if (seen.add(key)) reverse.add("MD: ${parts[3]} ${parts[4]} ${parts[1]} ${parts[2]}")
                }
            }
        }
        outReverse.get().asFile.setText(reverse.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('mapClient', JavaExec) {
    description = 'Remaps the official client jar from obfuscated names to MCP names (compile view).'
    dependsOn 'downloadClient', 'buildCombinedSrg'
    classpath = configurations.specialsource
    mainClass = 'net.md_5.specialsource.SpecialSource'
    inputs.file(clientJar)
    inputs.file(combinedSrg)
    outputs.file(mappedJar)
    doFirst {
        mappedJar.asFile.parentFile.mkdirs()
    }
    args = ['-i', clientJar.asFile.absolutePath,
            '-m', combinedSrg.get().asFile.absolutePath,
            '-o', mappedJar.asFile.absolutePath]
}

sourceSets {
    modloaderStub {
        java {
            srcDir 'src/modloaderStub/java'
        }
    }
}

compileJava {
    dependsOn 'mapClient', 'modloaderStubClasses'
    classpath = files(mappedJar, sourceSets.modloaderStub.output)
    options.release = 8
    options.compilerArgs << '-Xlint:none'
}

tasks.register('packThin', Zip) {
    description = 'Packs compiled classes into a jar for reobfuscation.'
    dependsOn compileJava
    from compileJava.destinationDirectory
    archiveFileName = 'pichenka-skins-thin.jar'
    destinationDirectory = thinJar.get().asFile.parentFile
}

tasks.register('reobf', JavaExec) {
    description = 'Reobfuscates mod classes back to Minecraft 1.2.5 runtime names.'
    dependsOn 'packThin', 'buildCombinedSrg'
    classpath = configurations.specialsource
    mainClass = 'net.md_5.specialsource.SpecialSource'
    inputs.file(thinJar)
    inputs.file(layout.buildDirectory.file('mappings/combined-reverse.srg'))
    outputs.file(obfJar)
    doFirst {
        obfJar.get().asFile.parentFile.mkdirs()
    }
    args = ['-i', thinJar.get().asFile.absolutePath,
            '-m', layout.buildDirectory.file('mappings/combined-reverse.srg').get().asFile.absolutePath,
            '-o', obfJar.get().asFile.absolutePath]
}

tasks.register('modJar', Jar) {
    description = 'Assembles the final drop-in mod jar for Minecraft 1.2.5.'
    dependsOn 'reobf', processResources
    archiveBaseName = 'pichenka-skins'
    archiveVersion = "${project.version}-mc1.2.5"
    from({ zipTree(obfJar.get().asFile) })
    from({ zipTree(obfJar.get().asFile) }) {
        include 'ahw.class'
        eachFile { details ->
            details.relativePath = new org.gradle.api.file.RelativePath(true, 'patched', 'ahw.class')
        }
        includeEmptyDirs = false
    }
    exclude 'META-INF/**'
    from processResources.destinationDirectory
    manifest {
        attributes('Implementation-Title': 'Pichenka Skins',
                'Implementation-Version': project.version,
                'Built-By': 'pichenka007gd',
                'Implementation-Vendor': 'pichenka007gd',
                'Target-Minecraft': '1.2.5')
    }
    destinationDirectory = layout.buildDirectory.dir('dist')
}

tasks.register('verifyJar') {
    description = 'Verifies the mod jar: replaced class is at the obfuscated position, all runtime references resolve against the official client jar.'
    dependsOn 'modJar', 'mapClient'
    doLast {
        def modFile = tasks.named('modJar', Jar).get().archiveFile.get().asFile
        def mod = new java.util.zip.ZipFile(modFile)
        def client = new java.util.zip.ZipFile(clientJar.asFile)

        def mustExist = ['ahw.class', 'patched/ahw.class', 'mod_PichenkaSkins.class',
                         'pichenka007gd/skins/PatchInstaller.class',
                         'pichenka007gd/skins/SkinConfig.class', 'pichenka007gd/skins/SkinFetcher.class',
                         'pichenka007gd/skins/SkinFormat.class', 'pichenka007gd/skins/SkinLog.class',
                         'pichenka007gd/skins/SkinSource.class', 'pichenka007gd/skins/SkinSources.class']
        mustExist.each {
            if (mod.getEntry(it) == null) throw new GradleException("mod jar is missing entry: ${it}")
        }
        if (mod.getEntry('net/minecraft/src/ThreadDownloadImage.class') != null) {
            throw new GradleException('mod jar still contains MCP-named ThreadDownloadImage (reobf failed)')
        }

        def patchedBytes = mod.getInputStream(mod.getEntry('patched/ahw.class')).bytes
        if (!(new String(patchedBytes, 'ISO-8859-1').contains('pichenka007gd'))) {
            throw new GradleException('patched/ahw.class does not reference pichenka007gd (wrong class packaged)')
        }

        def problems = new TreeSet<String>()
        def skip = { String owner ->
            owner.startsWith('java/') || owner.startsWith('javax/') || owner.startsWith('sun/') ||
                    owner.startsWith('jdk/') || owner.startsWith('pichenka007gd/') || owner.startsWith('[') ||
                    owner == 'BaseMod' || owner.startsWith('BaseMod$') ||
                    owner == 'mod_PichenkaSkins' || owner.startsWith('mod_PichenkaSkins$')
        }
        mod.entries().each { entry ->
            if (!entry.name.endsWith('.class')) return
            def refs = ClassFileParser.parse(mod.getInputStream(entry).bytes)
            refs.classRefs.each { owner ->
                if (skip(owner)) return
                if (client.getEntry(owner + '.class') == null) {
                    problems.add("${entry.name}: missing class ${owner}")
                }
            }
            refs.memberRefs.each { m ->
                def owner = m[0]
                def name = m[1]
                def desc = m[2]
                def kind = m[3]
                if (skip(owner)) return
                def ce = client.getEntry(owner + '.class')
                if (ce == null) {
                    problems.add("${entry.name}: missing class ${owner}")
                    return
                }
                def ownerInfo = ClassFileParser.parse(client.getInputStream(ce).bytes)
                def members = kind == 'field' ? ownerInfo.fields : ownerInfo.methods
                if (!members.any { it[0] == name && it[1] == desc }) {
                    problems.add("${entry.name}: ${owner}.${name} ${desc} not found in client jar")
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("unresolved runtime references:\n" + problems.join('\n'))
        }
        println "verifyJar OK: ${modFile.name} (${modFile.length()} bytes)"
    }
}

tasks.named('check') {
    dependsOn 'verifyJar'
}

tasks.named('build') {
    dependsOn 'verifyJar'
}

static def sha1Of(File f) {
    def digest = java.security.MessageDigest.getInstance('SHA-1')
    f.withInputStream { input ->
        def buf = new byte[8192]
        int n
        while ((n = input.read(buf)) > 0) digest.update(buf, 0, n)
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

class ClassFileParser {
    static Map parse(byte[] bytes) {
        def data = new DataInputStream(new ByteArrayInputStream(bytes))
        data.readInt()
        data.readUnsignedShort()
        data.readUnsignedShort()
        def count = data.readUnsignedShort()
        def utf8 = new String[count]
        def classRefs = new HashSet<String>()
        def memberRefs = new HashSet<List<String>>()
        def refsRaw = []
        def natName = new int[count]
        def natDesc = new int[count]
        int i = 1
        while (i < count) {
            int tag = data.readUnsignedByte()
            switch (tag) {
                case 1:
                    def len = data.readUnsignedShort()
                    def b = new byte[len]
                    data.readFully(b)
                    utf8[i] = new String(b, 'UTF-8')
                    break
                case 3: case 4: data.readInt(); break
                case 5: case 6: data.readLong(); i++; break
                case 7:
                    classRefs.add(data.readUnsignedShort())
                    break
                case 8: data.readUnsignedShort(); break
                case 9: case 10: case 11:
                    def ci = data.readUnsignedShort()
                    def ni = data.readUnsignedShort()
                    refsRaw.add([ci, ni, tag])
                    break
                case 12:
                    natName[i] = data.readUnsignedShort()
                    natDesc[i] = data.readUnsignedShort()
                    break
                case 15: data.readUnsignedByte(); data.readUnsignedShort(); break
                case 16: data.readUnsignedShort(); break
                case 17: case 18: data.readUnsignedShort(); data.readUnsignedShort(); break
                case 19: case 20: data.readUnsignedShort(); break
                default: throw new IOException("unknown constant pool tag ${tag}")
            }
            i++
        }
        classRefs = classRefs.collect { utf8[it] }.findAll { it != null } as Set
        refsRaw.each { r ->
            def ni = r[1]
            def owner = utf8[r[0]]
            def name = utf8[natName[ni]]
            def desc = utf8[natDesc[ni]]
            if (owner != null && name != null && desc != null) {
                memberRefs.add([owner, name, desc, r[2] == 9 ? 'field' : 'method'] as List)
            }
        }
        data.readUnsignedShort()
        data.readUnsignedShort()
        data.readUnsignedShort()
        def ifCount = data.readUnsignedShort()
        (0..<ifCount).each { data.readUnsignedShort() }
        def fields = readMembers(data, utf8)
        def methods = readMembers(data, utf8)
        return [classRefs: classRefs, memberRefs: memberRefs, fields: fields, methods: methods]
    }

    private static List readMembers(DataInputStream data, String[] utf8) {
        def count = data.readUnsignedShort()
        def out = []
        (0..<count).each {
            data.readUnsignedShort()
            def name = utf8[data.readUnsignedShort()]
            def desc = utf8[data.readUnsignedShort()]
            out.add([name, desc])
            def attrCount = data.readUnsignedShort()
            (0..<attrCount).each {
                data.readUnsignedShort()
                def len = data.readInt()
                (0..<len).each { data.readUnsignedByte() }
            }
        }
        return out
    }
}
